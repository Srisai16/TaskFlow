server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true

jwt:
  secret: ${JWT_SECRET:taskflow-local-development-secret-key-2026}

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
