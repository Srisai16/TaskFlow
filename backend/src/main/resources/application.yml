server:
  port: ${PORT:8080}

spring:
  application:
    name: taskflow

  datasource:
    # Default = embedded H2 (instant offline dev + tests). For a REAL database set these env vars:
    #   DB_URL / DB_USERNAME / DB_PASSWORD  (+ optionally DB_DRIVER, e.g. org.postgresql.Driver / com.mysql.cj.jdbc.Driver)
    # Just set DB_URL to your RDS/Render/managed instance:
    #   Postgres: jdbc:postgresql://<host>:5432/taskflow?sslmode=require
    #   MySQL:    jdbc:mysql://<host>:3306/taskflow?sslMode=REQUIRED
    url: ${DB_URL:jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # update = Spring integrates schema from entities on boot (Render Postgres first run creates tables automatically).
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

security:
  jwt:
    # 256-bit+ secret used to sign JWTs; override with JWT_SECRET in production (long random string, 64+ chars recommended).
    secret: ${JWT_SECRET:TaskFlowSuperSecretKeyForJwtSigningChangeMeInProduction123!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    # Comma-separated list of allowed browser origins. Defaults allow the local Vite dev server + any Vercel preview in dev.
    # Production: set CORS_ALLOWED_ORIGINS=https://<your-frontend>.vercel.app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  seed:
    # Run the demo DataSeeder on boot? False disables it (prod). Seeds admin+2 members+1 project+6 tasks+comments when DB empty.
    enabled: ${APP_SEED_ENABLED:true}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOGGING:off}