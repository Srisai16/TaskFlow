server:
  port: 8080

spring:
  application:
    name: taskflow

  datasource:
    url: jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

app:
  jwt:
    # 256-bit+ secret used to sign JWTs (base64 not required). Override in production.
    secret: "TaskFlowSuperSecretKeyForJwtSigningChangeMeInProduction123!"
    expiration-ms: 86400000
  seed:
    enabled: true

logging:
  level:
    org.springframework.web: INFO