services:
  - type: web
    name: taskflow-api
    runtime: docker
    plan: free
    rootDir: backend
    envVars:
      - key: DB_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: taskflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: taskflow-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://taskflow-liart-theta.vercel.app"

databases:
  - name: taskflow-db
    plan: free
    databaseName: taskflow
    user: taskflow